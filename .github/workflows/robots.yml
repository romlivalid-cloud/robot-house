# Robot House — Jalankan Robot Terjadwal
#
# Menjalankan robot berstatus "active" setiap 30 menit, lalu menyimpan
# kembali state (bus/log.jsonl, inbox, registry) dan menyinkronkannya
# ke dashboard/data/ agar GitHub Pages selalu menampilkan data terbaru.
#
# Aman dari loop: commit memakai "[skip ci]" sehingga tidak memicu
# workflow ini lagi. Push hanya dilakukan bila ada perubahan.

name: Robot House — Jalankan Robot Terjadwal

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-robots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jalankan robot terjadwal
        run: |
          python3 robots/run_scheduled.py

      - name: Sinkronkan data ke dashboard
        run: |
          mkdir -p dashboard/data
          cp bus/log.jsonl dashboard/data/log.jsonl
          cp robots/registry.json dashboard/data/registry.json

      - name: Commit dan push bila ada perubahan
        run: |
          git config user.name "robot-house-bot"
          git config user.email "robot-house-bot@users.noreply.github.com"
          git add bus/log.jsonl bus/inbox robots/registry.json dashboard/data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan — lewati push."
          else
            git commit -m "update state robot [skip ci]"
            git push
          fi
